{{- if .Values.ingress.enabled }}
# Optional HTTP-only check on a disposable VM without an existing 80/443 listener.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: study-web
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: study-web
                port:
                  number: 80
{{- end }}
