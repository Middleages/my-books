name: Build and deploy textbook
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  verify-production:
    name: Production browser (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [insurance, investing, tax, book-volumes, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/production-artifact
      - name: Read exact production build
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/production-artifact/artifact.tar" -C dist
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/investing-qa" --no-save --ignore-scripts playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify ${{ matrix.suite }} production textbook in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/investing-qa/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/${{ matrix.suite }}-browser-qa.cjs
      - name: Save ${{ matrix.suite }} browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-browser-local
          path: artifacts/${{ matrix.suite }}-browser/
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, verify-production]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify-published:
    name: Published browser (${{ matrix.suite }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [insurance, investing, tax, book-volumes, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/published-artifact
      - name: Read exact deployed build
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/published-artifact/artifact.tar" -C dist
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/investing-qa" --no-save --ignore-scripts playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify live ${{ matrix.suite }} assets and textbook
        env:
          NODE_PATH: ${{ runner.temp }}/investing-qa/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          LIVE_URL: https://middleages.github.io/my-books/
        run: node scripts/${{ matrix.suite }}-browser-qa.cjs
      - name: Save published ${{ matrix.suite }} browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-browser-published
          path: artifacts/${{ matrix.suite }}-browser/
          if-no-files-found: warn
